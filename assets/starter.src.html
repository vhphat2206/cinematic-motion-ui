<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand — one specific line</title>
<!-- FONTS: pick the pair in references/typography.md. Add &subset is automatic; check Vietnamese coverage. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<!-- Optional: WAAPI intro gate (only if you use MK.intro). Hides [data-mk] targets before first paint, 4 s failsafe. -->
<!-- <script>(function(r){try{if(!matchMedia("(prefers-reduced-motion: reduce)").matches&&typeof r.animate==="function"){r.classList.add("mk-intro");window.__mkFailsafe=setTimeout(function(){r.classList.remove("mk-intro")},4000)}}catch(e){}})(document.documentElement);</script> -->
<style>
/* ---- anti-flash: background first ---- */
html,body{background:#000}

/* ==== motion-kit.css (inlined) ==== */
/*@@MOTION_KIT_CSS@@*/

/* ==== TOKENS: restyle per archetype (references/archetypes.md) ==== */
:root{
  --bg:#000; --ink:#fff; --muted:#9a9a9a; --line:rgba(255,255,255,.14); --accent:#fff;
  --display:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --accent-face:"Newsreader",Georgia,serif;
  --h1:48px; --lede:15.5px; --nav:14px; --nav-h:40px; --btn:13.5px; --btn-h:40px; --hero-btn-h:42px; --micro:12px;
  --pad-x:40px; --pad-y:22px; --hero-gap:85px; --copy-max:860px; --lede-max:470px;
  --r-ctrl:6px;
}

/* ---- base ---- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{color:var(--ink)}
body{font-family:var(--display);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ---- layer stack: bg → media (+scrim) → page → grain ---- */
.media{position:fixed;inset:0;z-index:0;overflow:hidden}
.media>canvas,.media>video,.media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.media::after{content:"";position:absolute;inset:0;pointer-events:none;
  /* SCRIM: tune to the media; darken only where text sits */
  background:radial-gradient(120% 70% at 50% 100%,rgba(0,0,0,.8) 10%,transparent 60%),linear-gradient(180deg,rgba(0,0,0,.5),transparent 22%)}
.page{position:relative;z-index:1;display:grid;grid-template-rows:auto 1fr auto;min-height:100vh;min-height:100dvh}

/* ---- header: 1fr | auto | 1fr ---- */
.header{position:relative;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:var(--pad-y) var(--pad-x) 10px}
.logo{justify-self:start;display:inline-flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.03em}
.logo svg{width:22px;height:22px}
.nav{justify-self:center;display:flex;gap:8px}
.nav a{display:inline-flex;align-items:center;height:var(--nav-h);padding:0 16px;font-size:var(--nav);letter-spacing:-.01em;border-radius:var(--r-ctrl)}
.header-cta{justify-self:end}
.burger{display:none}

/* ---- buttons: replace with recipes from references/materials.md ---- */
.btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;height:var(--btn-h);padding:0 16px;
  border-radius:var(--r-ctrl);font-size:var(--btn);font-weight:500;letter-spacing:-.02em;line-height:1;white-space:nowrap;transition:background .35s,border-color .35s,box-shadow .35s,color .35s}
.btn-solid{background:var(--ink);color:var(--bg)}
.btn-ghost{border:1px solid var(--line)}

/* ---- hero: bottom-anchored ---- */
.hero{display:flex;align-items:flex-end;justify-content:center;padding:8px 24px var(--hero-gap)}
.copy{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:var(--copy-max)}
.eyebrow{margin-bottom:22px;font-size:var(--micro);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-size:var(--h1);font-weight:500;letter-spacing:-.045em;line-height:1.12}
h1 em{font-family:var(--accent-face);font-style:italic;font-weight:400;font-size:1.08em;letter-spacing:-.02em;color:var(--muted)}
.lede{max-width:var(--lede-max);margin-top:18px;color:var(--muted);font-size:var(--lede);line-height:1.55;letter-spacing:-.015em}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
.actions .btn{height:var(--hero-btn-h);padding:0 18px}

/* ---- footer row: stats only if the user gave real numbers; otherwise facts or corner copy ---- */
.foot{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 var(--pad-x) 32px;padding-bottom:max(32px,env(safe-area-inset-bottom));
  font-size:13.5px;color:var(--muted);letter-spacing:-.01em}

/* ---- breakpoints: tokens only (references/responsive.md) ---- */
@media (min-width:1600px){:root{--h1:64px;--lede:18px;--nav:15px;--nav-h:44px;--btn:15px;--btn-h:44px;--hero-btn-h:48px;--pad-x:64px;--pad-y:28px;--copy-max:980px;--lede-max:540px}}
@media (min-width:1280px) and (max-width:1599px){:root{--h1:54px;--lede:16px;--pad-x:48px;--copy-max:900px}}
@media (min-width:901px) and (max-width:1279px){:root{--h1:42px;--lede:15px;--nav:13px;--nav-h:36px;--pad-x:28px;--hero-gap:64px;--copy-max:760px;--lede-max:440px}}
@media (min-width:901px) and (max-height:850px){:root{--pad-y:14px;--hero-gap:48px;--h1:40px}}
@media (min-width:901px) and (max-height:720px){:root{--h1:34px;--lede:14px;--hero-gap:32px;--nav-h:30px;--btn-h:34px;--hero-btn-h:36px}}
@media (min-width:901px){html,body{height:100%;overflow:hidden}.page{height:100vh;height:100dvh;overflow:hidden}}
@media (max-width:900px){
  :root{--h1:36px;--lede:16px;--pad-x:16px;--pad-y:16px;--hero-gap:36px;--btn:15px;--btn-h:46px;--hero-btn-h:48px}
  .header{grid-template-columns:1fr auto auto;gap:8px}
  .burger{display:grid;place-content:center;gap:5px;width:42px;height:42px;border-radius:var(--r-ctrl);border:1px solid var(--line);background:rgba(8,8,8,.55);position:relative;z-index:80}
  .burger i{display:block;width:16px;height:1.5px;background:var(--ink);border-radius:1px;transition:transform .25s,opacity .2s}
  .menu-open .burger i:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
  .menu-open .burger i:nth-child(2){opacity:0}
  .menu-open .burger i:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
  /* full-screen menu; justify/align-self:stretch undo the desktop grid centring (else it shrink-wraps) */
  .nav{position:fixed;inset:0;z-index:45;justify-self:stretch;align-self:stretch;flex-direction:column;justify-content:center;gap:12px;
    padding:max(96px,calc(env(safe-area-inset-top) + 88px)) 22px 32px;background:rgba(8,8,8,.42);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s}
  .menu-open .nav{opacity:1;visibility:visible}
  .nav a{width:100%;height:56px;justify-content:center;font-size:19px;border-radius:10px}
  .logo,.header-cta{position:relative;z-index:80}
  .foot{flex-direction:column;gap:12px;text-align:center}
  body.menu-open{overflow:hidden}
}
@media (max-width:560px){.actions{flex-direction:column;width:100%}.actions .btn{width:100%}.header-cta{display:none}}
</style>
</head>
<body>
<div class="mk-grain" aria-hidden="true"></div>
<!-- MEDIA: user asset > generative (assets/backgrounds) > slot with fallback + generation prompt (references/media.md) -->
<div class="media appear appear--media" aria-hidden="true" style="--d:0s"><canvas id="bg"></canvas></div>

<div class="page">
  <header class="header">
    <a class="logo appear appear--scale" href="#top" style="--d:.08s" aria-label="Brand home">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><!-- draw a mark for this brand --><circle cx="12" cy="12" r="5"/></svg>
      Brand
    </a>
    <nav class="nav" id="site-nav" aria-label="Primary">
      <a class="appear appear--scale" href="#a" style="--d:.16s">One</a>
      <a class="appear appear--soft" href="#b" style="--d:.28s">Two</a>
      <a class="appear appear--scale" href="#c" style="--d:.40s">Three</a>
    </nav>
    <a class="btn btn-solid header-cta appear appear--scale" href="#start" style="--d:.34s">Specific action</a>
    <button class="burger appear appear--scale" style="--d:.34s" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu"><i></i><i></i><i></i></button>
  </header>

  <main class="hero" id="top">
    <div class="copy">
      <!-- Optional label. Not a "✦ New" pill by default: see anti-ai-tells.md § Second-order tells -->
      <p class="eyebrow appear appear--pop" style="--d:.22s">Specific label, or delete</p>
      <!-- Emphasis comes from the brief (scale, weight, a concept mark); no serif-italic accent word by default -->
      <h1>
        <span class="mask-line"><span class="appear appear--mask" style="--d:.42s">Line one, broken on meaning,</span></span>
        <span class="mask-line"><span class="appear appear--mask" style="--d:.62s">and a deliberate line two.</span></span>
      </h1>
      <p class="lede appear appear--soft" style="--d:.82s;--dur:1.25s">One or two sentences in the subject's own nouns. No clichés.</p>
      <div class="actions">
        <a class="btn btn-solid appear appear--btn" href="#start" style="--d:.96s">What happens next</a>
        <a class="btn btn-ghost appear appear--side" href="#more" style="--d:1.10s">Secondary</a>
      </div>
    </div>
  </main>

  <!-- Optional. A three-up stats strip reads as template furniture: prefer one real fact,
       a small spec table or corner copy, or delete the footer row entirely. -->
  <footer class="foot">
    <span class="appear appear--rise" style="--d:1.12s">One real, specific fact</span>
  </footer>
</div>

<script>
/* ==== motion-kit.js (inlined) ==== */
/*@@MOTION_KIT_JS@@*/
</script>
<script>
/* paste a background from assets/backgrounds/ here, then initialise it, e.g.:
   ParticleWave(document.getElementById('bg'), { color:[235,238,245] }); */
MK.appear();
MK.menu(document.querySelector('.burger'), document.getElementById('site-nav'));
</script>
</body>
</html>
